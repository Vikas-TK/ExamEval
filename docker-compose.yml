services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exam_eval
      POSTGRES_USER: exam_eval
      POSTGRES_PASSWORD: exam_eval_dev_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exam_eval -d exam_eval"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  db-migrate:
    build: .
    command: alembic upgrade head
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://exam_eval:exam_eval_dev_password@db:5432/exam_eval
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://exam_eval:exam_eval_dev_password@db:5432/exam_eval
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
